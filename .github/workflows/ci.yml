name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  php:
    name: "PHP ${{ matrix.php-version }} (syntaxe + WordPress Coding Standards)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none

      - name: Vérification de la syntaxe PHP
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 -I{} php -l {}

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}

      - name: Installer les dépendances Composer
        run: composer install --no-progress --prefer-dist

      - name: WordPress Coding Standards (PHPCS)
        run: vendor/bin/phpcs

      - name: Tests unitaires (PHPUnit)
        run: vendor/bin/phpunit

  js-css:
    name: JS & CSS Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances npm
        run: npm install

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

  build:
    name: Build du plugin (zip)
    needs: [php, js-css]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le dossier du plugin (fichiers de dev exclus via .distignore)
        run: |
          mkdir -p build/navi-faq
          rsync -a --exclude-from='.distignore' ./ build/navi-faq/
          cd build && zip -r navi-faq.zip navi-faq

      - name: Uploader l'artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: navi-faq
          path: build/navi-faq.zip

      - name: Attacher le zip à la Release GitHub
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/navi-faq.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
